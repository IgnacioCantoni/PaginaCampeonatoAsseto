<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>WateN Racing Championship</title>
<link rel="icon" href="/PaginaCampeonatoAsseto/logo.jpg">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0d0f13; color: #e9edf3; font-family: 'Segoe UI', system-ui, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
  img { width: 140px; height: 140px; border-radius: 24px; box-shadow: 0 10px 40px rgba(249, 115, 22, .25); }
  h1 { font-size: 20px; margin: 20px 0 6px; }
  p { color: #8c96a6; margin: 6px 0; }
  a { color: #fb923c; }
</style>
</head>
<body>
<main>
  <img src="/PaginaCampeonatoAsseto/logo.jpg" alt="WateN Racing Championship">
  <h1 id="title">Entrando a WateN Racing Championship…</h1>
  <p id="msg"></p>
</main>
<script>
(function () {
  var base = "/PaginaCampeonatoAsseto/";
  var fallback = "https://its-tuning-coupon-canyon.trycloudflare.com";
  // Ruta pedida dentro de la dirección fija (ej. /waten/en-vivo → /en-vivo), para llevar a la misma página.
  var rest = location.pathname.indexOf(base) === 0 ? location.pathname.slice(base.length) : '';
  rest = rest.replace(/^index\.html$/, '').replace(/^404\.html$/, '');
  function go(url) {
    if (!url) {
      document.getElementById('title').textContent = 'La web de WateN está apagada ahora';
      document.getElementById('msg').textContent = 'Cuando el organizador la prenda, esta misma dirección vuelve a andar.';
      return;
    }
    location.replace(url.replace(/\/$/, '') + '/' + rest + location.hash);
  }
  fetch(base + 'link.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) { go(d.url); })
    .catch(function () { go(fallback); });
})();
</script>
</body>
</html>
